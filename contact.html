<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:       #f3ecd8;
    --paper-soft:  #efe6cd;
    --ink:         #1d1a16;
    --pencil:      #5a564c;
    --red:         #b52d2d;
    --green:       #4a7c3a;
    --tab-3:       #e9d9a8;
    --rule-blue:   #7c9cbf;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family:'Spectral',Georgia,serif;
    background-image:
      linear-gradient(rgba(124,156,191,0.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,156,191,0.14) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1.5px);
    background-size: 22px 22px, 22px 22px, 5px 5px;
  }
  ::selection{ background: var(--red); color: var(--paper); }

  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: 60px 24px 48px;
  }

  .back{
    display: inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size: 12px;
    color: var(--pencil);
    text-decoration: none;
    margin-bottom: 26px;
    letter-spacing: 1px;
  }
  .back:hover{ color: var(--red); }

  .masthead{ margin-bottom: 28px; }
  h1.title{
    font-family:'Architects Daughter','Caveat',cursive;
    font-size: 48px;
    margin: 0;
    letter-spacing: -1px;
    text-shadow: 2px 2px 0 rgba(181,45,45,0.22);
  }
  h1 .dot{ color: var(--red); }
  .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size: 12px;
    color: var(--pencil);
    margin: 4px 0 0;
    letter-spacing: 1px;
    text-transform: lowercase;
  }

  .card{
    position: relative;
    background: var(--paper-soft);
    border: 2px solid var(--ink);
    box-shadow: 7px 7px 0 var(--ink);
    padding: 34px 30px 28px;
  }
  .card .tab-strip{
    position: absolute;
    top: -22px; left: 24px;
    padding: 8px 18px 12px;
    background: var(--tab-3);
    border: 2px solid var(--ink);
    border-bottom: none;
    border-radius: 14px 16px 0 0 / 26px 24px 0 0;
    font-family:'IBM Plex Mono',monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .lede{
    margin: 0 0 22px;
    font-family:'Spectral',serif;
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
  }
  .lede a{
    color: var(--red);
    border-bottom: 1.5px solid var(--red);
    text-decoration: none;
    font-family:'IBM Plex Mono',monospace;
    font-size: 14.5px;
  }

  form{ margin: 0; }
  label{
    display: block;
    font-family:'IBM Plex Mono',monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--pencil);
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="email"],
  textarea{
    width: 100%;
    padding: 10px 12px;
    font-family:'IBM Plex Mono',monospace;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    margin-bottom: 16px;
    outline: none;
    resize: vertical;
  }
  textarea{ min-height: 140px; line-height: 1.5; }
  input:focus, textarea:focus{
    border-color: var(--red);
    box-shadow: 3px 3px 0 var(--red);
  }

  .submit{
    width: 100%;
    padding: 12px;
    font-family:'Architects Daughter',cursive;
    font-size: 22px;
    color: var(--paper);
    background: var(--ink);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--red);
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .submit:hover{ transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--red); }
  .submit:active{ transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--red); }

  .msg{
    margin-top: 16px;
    padding: 12px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size: 12.5px;
    line-height: 1.45;
    border: 1.5px dashed var(--pencil);
    display: none;
  }
  .msg.show{ display: block; }
  .msg.ok{ border-color: var(--green); color: var(--green); background: rgba(74,124,58,0.08); }

  .direct{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px dashed var(--pencil);
    text-align: center;
    font-family:'Caveat',cursive;
    font-size: 18px;
    color: var(--pencil);
  }
  .direct a{
    display: inline-block;
    margin-top: 4px;
    font-family:'IBM Plex Mono',monospace;
    font-size: 14px;
    color: var(--ink);
    border-bottom: 1.5px solid var(--red);
    text-decoration: none;
  }
</style>
<link rel="stylesheet" href="/assets/top-nav.css?v=1">
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="wrap">
  <a class="back" href="/">← back to Casen</a>

  <header class="masthead">
    <h1 class="title">contact us<span class="dot">.</span></h1>
    <p class="sub">questions, feedback, or just want to say hi</p>
  </header>

  <div class="card">
    <span class="tab-strip">get in touch</span>

    <form id="contact-form" novalidate>
      <label for="c-name">your name</label>
      <input type="text" id="c-name" name="name" autocomplete="name" placeholder="Jane Doe">

      <label for="c-email">your email</label>
      <input type="email" id="c-email" name="email" autocomplete="email" placeholder="you@example.com">

      <label for="c-subject">subject</label>
      <input type="text" id="c-subject" name="subject" placeholder="Feedback on the Consulting tab">

      <label for="c-message">message</label>
      <textarea id="c-message" name="message" placeholder="What's on your mind?"></textarea>

      <button type="submit" class="submit">send message &rarr;</button>

      <div class="msg ok" id="c-msg">Opening your mail client — if nothing happened, copy the email above and send it manually.</div>
    </form>

    <div class="direct">
      prefer plain email?<br>
      <a href="mailto:rohanmalhotra5337@gmail.com">rohanmalhotra5337@gmail.com</a>
    </div>
  </div>
</div>

<script type="module" src="/assets/top-nav.js?v=1"></script>
<script>
(function(){
  var form = document.getElementById('contact-form');
  var msg  = document.getElementById('c-msg');
  if (!form) return;

  form.addEventListener('submit', function(e){
    e.preventDefault();

    var name    = document.getElementById('c-name').value.trim();
    var email   = document.getElementById('c-email').value.trim();
    var subject = document.getElementById('c-subject').value.trim() || 'Casen — message from site';
    var message = document.getElementById('c-message').value.trim();

    var body =
      'From: ' + (name || '(no name)') + '\n' +
      'Reply-to: ' + (email || '(none)') + '\n\n' +
      (message || '(empty)');

    var href = 'mailto:rohanmalhotra5337@gmail.com'
      + '?subject=' + encodeURIComponent(subject)
      + '&body=' + encodeURIComponent(body);

    window.location.href = href;
    msg.classList.add('show');
  });
})();
</script>

</body>
</html>
