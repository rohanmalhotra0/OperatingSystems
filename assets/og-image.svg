<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Casen — the consulting casebook, rebuilt as a study tool">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(124,156,191,0.18)" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ecd8"/>
      <stop offset="100%" stop-color="#e6dcc0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <line x1="120" y1="0" x2="120" y2="630" stroke="#b52d2d" stroke-width="2" opacity="0.55"/>

  <g transform="translate(1020,120) rotate(-25) scale(8)">
    <rect x="13" y="4" width="6" height="3" fill="#1d1a16"/>
    <rect x="13" y="7" width="6" height="18" fill="#b52d2d"/>
    <polygon points="13,25 16,29 19,25" fill="#e8d2a8"/>
    <polygon points="14.5,27 16,29 17.5,27" fill="#1d1a16"/>
  </g>

  <text x="170" y="245" font-family="'Spectral', Georgia, serif" font-weight="700" font-size="148" fill="#1d1a16" letter-spacing="-2">Casen<tspan fill="#b52d2d">.</tspan></text>

  <text x="170" y="320" font-family="'Spectral', Georgia, serif" font-style="italic" font-size="40" fill="#5a564c">the consulting casebook,</text>
  <text x="170" y="370" font-family="'Spectral', Georgia, serif" font-style="italic" font-size="40" fill="#5a564c">rebuilt as a study tool</text>

  <g font-family="'Architects Daughter', 'Caveat', cursive" font-size="32" fill="#1d1a16">
    <g transform="translate(170,470)">
      <rect x="-12" y="-30" width="190" height="48" rx="8" fill="#e7c7a1" stroke="#1d1a16" stroke-width="1.5"/>
      <text x="82" y="2" text-anchor="middle">71 cases</text>
    </g>
    <g transform="translate(380,470)">
      <rect x="-12" y="-30" width="220" height="48" rx="8" fill="#c9d4a8" stroke="#1d1a16" stroke-width="1.5"/>
      <text x="98" y="2" text-anchor="middle">8 frameworks</text>
    </g>
    <g transform="translate(610,470)">
      <rect x="-12" y="-30" width="220" height="48" rx="8" fill="#d8c4e0" stroke="#1d1a16" stroke-width="1.5"/>
      <text x="98" y="2" text-anchor="middle">AI voice mocks</text>
    </g>
    <g transform="translate(840,470)">
      <rect x="-12" y="-30" width="200" height="48" rx="8" fill="#e9d9a8" stroke="#1d1a16" stroke-width="1.5"/>
      <text x="88" y="2" text-anchor="middle">live job board</text>
    </g>
  </g>

  <text x="170" y="585" font-family="'IBM Plex Mono', monospace" font-size="28" fill="#5a564c">getcasen.com</text>
</svg>
